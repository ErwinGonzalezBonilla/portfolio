<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Salvador cumple 5 años! 🎈</title>
<meta name="description" content="Domingo 11 de octubre · Kids Park (Av. Salesianos 71, San Joaquín) · de 14:00 a 17:00. ¡Te esperamos!">
<meta property="og:title" content="¡Salvador cumple 5 años! 🎈">
<meta property="og:description" content="Domingo 11 de octubre en Kids Park, de 14:00 a 17:00. Confirma tu asistencia aquí.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #8ED8FF;
    --sky-deep: #4FB6F0;
    --sun: #FFD23F;
    --tomato: #FF5A4E;
    --grass: #2FBF71;
    --ink: #1D2B53;
    --card: #FFFFFF;
    --wa: #25D366;
    --wa-dark: #128C4A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky: #1B3F6B;
      --sky-deep: #12305A;
      --card: #FFFDF6;
    }
  }
  :root[data-theme="dark"] { --sky: #1B3F6B; --sky-deep: #12305A; --card: #FFFDF6; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    background: var(--sky);
    background-image: radial-gradient(circle at 20% 10%, rgba(255,255,255,.35) 0 60px, transparent 61px),
                      radial-gradient(circle at 85% 25%, rgba(255,255,255,.3) 0 45px, transparent 46px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 40px;
    overflow-x: hidden;
  }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .confetti span {
    position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px;
    animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } .balloon { animation: none !important; } }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    background: var(--card);
    border-radius: 36px;
    border: 4px solid var(--ink);
    box-shadow: 10px 12px 0 var(--ink);
    padding: 28px 24px 30px;
    text-align: center;
  }
  .balloons { display: flex; justify-content: center; gap: 6px; margin: -90px auto 4px; height: 170px; }
  .balloon { animation: bob 3.2s ease-in-out infinite; transform-origin: bottom center; }
  .balloon:nth-child(2) { animation-delay: -1.1s; }
  .balloon:nth-child(3) { animation-delay: -2.1s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }

  .lead { font-weight: 800; font-size: 1.1rem; margin: 0 0 4px; }
  h1 {
    font-family: "Bagel Fat One", "Arial Rounded MT Bold", "Nunito", sans-serif;
    font-weight: 400;
    font-size: clamp(2.8rem, 13vw, 3.8rem);
    line-height: 1;
    margin: 0;
    color: var(--tomato);
    -webkit-text-stroke: 2px var(--ink);
    text-shadow: 4px 4px 0 var(--sun);
    letter-spacing: .5px;
  }
  .age {
    display: inline-flex; align-items: center; gap: 10px;
    margin: 14px 0 22px;
    font-weight: 900; font-size: 1.25rem;
  }
  .age b {
    font-family: "Bagel Fat One", "Nunito", sans-serif; font-weight: 400;
    font-size: 4.2rem; line-height: .9; color: var(--sun);
    -webkit-text-stroke: 3px var(--ink);
    transform: rotate(-8deg); display: inline-block;
  }
  .details { display: grid; gap: 10px; margin: 0 0 26px; text-align: left; }
  .row {
    display: flex; align-items: center; gap: 14px;
    background: #F2FAFF; border: 3px solid var(--ink); border-radius: 18px;
    padding: 12px 14px;
  }
  .row:nth-child(2) { background: #FFF6D6; }
  .row:nth-child(3) { background: #E6F8EE; }
  .row .ico { font-size: 1.8rem; line-height: 1; }
  .row small { display: block; font-weight: 700; font-size: .85rem; opacity: .7; }
  .row strong { font-weight: 900; font-size: 1.15rem; }
  .maps { color: inherit; text-decoration: none; }
  .maps:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
  .addr { display: block; font-weight: 700; font-size: .95rem; margin-top: 2px; }
  .maplink { display: inline-block; margin-top: 6px; font-weight: 900; font-size: .9rem; color: #0B6E3A; text-decoration: underline; text-underline-offset: 3px; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    background: var(--wa); color: #fff;
    font-family: inherit; font-weight: 900; font-size: 1.1rem;
    text-decoration: none; line-height: 1.25;
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 16px 20px;
    box-shadow: 0 6px 0 var(--wa-dark), 0 6px 0 3px var(--ink);
    transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--wa-dark), 0 1px 0 3px var(--ink); }
  .btn:focus-visible { outline: 4px solid var(--sun); outline-offset: 4px; }
  .btn svg { flex: none; }
  .note { margin: 16px 0 0; font-weight: 700; font-size: .95rem; }
</style>
</head>
<body>
  <div class="confetti" aria-hidden="true" id="confetti"></div>

  <main class="card">
    <div class="balloons" aria-hidden="true">
      <svg class="balloon" width="70" height="160" viewBox="0 0 70 160"><path d="M35 88 C 30 110, 42 125, 33 160" stroke="#1D2B53" stroke-width="2" fill="none"/><ellipse cx="35" cy="42" rx="30" ry="38" fill="#FF5A4E" stroke="#1D2B53" stroke-width="3"/><path d="M29 80 L41 80 L35 89 Z" fill="#FF5A4E" stroke="#1D2B53" stroke-width="3" stroke-linejoin="round"/><ellipse cx="24" cy="28" rx="6" ry="10" fill="#fff" opacity=".6"/></svg>
      <svg class="balloon" width="70" height="170" viewBox="0 0 70 170" style="margin-top:-14px"><path d="M35 88 C 42 115, 28 130, 36 170" stroke="#1D2B53" stroke-width="2" fill="none"/><ellipse cx="35" cy="42" rx="30" ry="38" fill="#FFD23F" stroke="#1D2B53" stroke-width="3"/><path d="M29 80 L41 80 L35 89 Z" fill="#FFD23F" stroke="#1D2B53" stroke-width="3" stroke-linejoin="round"/><ellipse cx="24" cy="28" rx="6" ry="10" fill="#fff" opacity=".6"/></svg>
      <svg class="balloon" width="70" height="160" viewBox="0 0 70 160"><path d="M35 88 C 28 112, 40 128, 34 160" stroke="#1D2B53" stroke-width="2" fill="none"/><ellipse cx="35" cy="42" rx="30" ry="38" fill="#2FBF71" stroke="#1D2B53" stroke-width="3"/><path d="M29 80 L41 80 L35 89 Z" fill="#2FBF71" stroke="#1D2B53" stroke-width="3" stroke-linejoin="round"/><ellipse cx="24" cy="28" rx="6" ry="10" fill="#fff" opacity=".6"/></svg>
    </div>

    <p class="lead">¡Estás invitado al cumple de</p>
    <h1>Salvador!</h1>
    <div class="age">cumple <b>5</b> años 🎉</div>

    <section class="details">
      <div class="row"><span class="ico">📅</span><div><small>Cuándo</small><strong>Domingo 11 de octubre</strong></div></div>
      <div class="row"><span class="ico">⏰</span><div><small>Hora</small><strong>De 14:00 a 17:00</strong></div></div>
      <a class="row maps" href="https://www.google.com/maps/search/?api=1&query=Avenida%20Salesianos%2071%2C%20San%20Joaqu%C3%ADn%2C%20Santiago%2C%20Chile" target="_blank" rel="noopener"><span class="ico">📍</span><div><small>Dónde</small><strong>Kids Park</strong><span class="addr">Av. Salesianos 71, San Joaquín, Santiago</span><span class="maplink">Ver en Google Maps</span></div></a>
    </section>

    <a class="btn" id="rsvp" href="#" target="_blank" rel="noopener">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
      Confirmar asistencia al cumpleaños de Salvador
    </a>
    <p class="note">¡Te esperamos para jugar y celebrar! 🎂</p>
  </main>

<script>
  // Número de WhatsApp de mamá (formato internacional, sin + ni espacios). Ej: 34612345678
  var MAMA_PHONE = "56937103252";
  var MENSAJE = "¡Sí, asistiré al cumpleaños de Salvador! 🎉";

  var url = MAMA_PHONE
    ? "https://wa.me/" + MAMA_PHONE + "?text=" + encodeURIComponent(MENSAJE)
    : "https://wa.me/?text=" + encodeURIComponent(MENSAJE);
  document.getElementById("rsvp").href = url;

  // Confeti
  var colors = ["#FF5A4E", "#FFD23F", "#2FBF71", "#FFFFFF", "#1D2B53"];
  var box = document.getElementById("confetti");
  for (var i = 0; i < 28; i++) {
    var s = document.createElement("span");
    s.style.left = Math.random() * 100 + "vw";
    s.style.background = colors[i % colors.length];
    s.style.animationDuration = (6 + Math.random() * 7) + "s";
    s.style.animationDelay = (-Math.random() * 12) + "s";
    s.style.transform = "rotate(" + Math.random() * 360 + "deg)";
    box.appendChild(s);
  }
</script>
</body>
</html>
